<div class="manage-account-page">
  <div class="page-overlay"></div>

  <div class="content-wrapper">
    <!-- Top bar -->
    <header class="topbar">
      <div class="breadcrumb">
        <span>Dashboard</span>
        <span class="separator">/</span>
        <span class="current">Manage Account</span>
      </div>

      <div class="topbar-right">
        <div class="user-box">
          <div class="user-info">
            <span class="user-icon">👤</span>
            <span class="user-name">{{username}}</span>
          </div>

        </div>
      </div>
    </header>

    <!-- Title + nav -->
    <section class="page-header">
      <h1>Manage Your Account</h1>

      <nav class="menu-tabs">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Portfolio</a>
      </nav>
    </section>

    <!-- Main content -->
    <section class="main-panel">
      <!-- Left -->
      <div class="gallery-section">
        <h2>Gallery Management</h2>

        <div class="gallery-grid">
          <div class="upload-card" (click)="onOpenUploadPhoto()">
            <span class="camera-icon">📷</span>
          </div>
          @for (photo of photos; track $index;) {
            <div class="photo-card">
              <img [src]="photo.url" alt="Photo 1" />
              <div class="card-actions">
                <button>✎</button>
                <button>🗑</button>
              </div>
            </div>
          }
         
        </div>

        <div class="pagination">
          <button>&lt;</button>
          <button class="active-page">1</button>
          <button>2</button>
          <button>&gt;</button>
        </div>
      </div>

      <!-- Right -->
      <div class="contact-section">
        <h2>Contact Information</h2>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" value="juan.perez@example.com" [(ngModel)]="photographerInfo.email"/>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" value="(123) 456-7890" [(ngModel)]="photographerInfo.phone"/>
        </div>

        <div class="form-group">
          <label>Location</label>
          <input type="text" value="Mexico City, Mexico" [(ngModel)]="photographerInfo.location"/>
        </div>

        <div class="form-group">
          <label>Instagram</label>
          <input type="text" value="instagram" [(ngModel)]="photographerInfo.instagram" />
        </div>

        <div class="form-group">
          <label>Facebook</label>
          <input type="text" value="facebook" [(ngModel)]="photographerInfo.facebook"/>
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" value="Description" [(ngModel)]="photographerInfo.biography"/>
        </div>

        <button class="update-btn" (click)="onUpdateInfo()">Update Info</button>
      </div>
    </section>
  </div>
</div>

@if(isOpenUploadModal) {
  <div class="modal-backdrop">
    <app-upload-photo (close)="onCloseUploadModal()"></app-upload-photo>
  </div>
}
